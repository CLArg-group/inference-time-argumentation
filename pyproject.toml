[build-system]
requires = ["setuptools>=80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ita"
version = "0.1.0"
description = "Inference-Time Argumentation (ITA) - neurosymbolic learning for ternary claim verification with argumentative LLMs"
readme = "README.md"
requires-python = ">=3.10"
authors = []
license-files = ["LICENSE"]
keywords = ["llm", "argumentation", "uncertainty", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "accelerate>=0.33.0",
    "anthropic>=0.68.0",
    "bitsandbytes>=0.43.3",
    "datasets>=2.19.1",
    "httpx>=0.27.0",
    "numpy>=1.26.4",
    "openai>=1.40.6",
    "pandas>=2.2.2",
    "scikit-learn>=1.5.1",
    "scipy>=1.14.0",
    "tenacity>=9.1.0",
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "tqdm>=4.66.4",
    "google-genai>=1.74.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
grpo = [
    "peft>=0.17.0",
    "tensorboard>=2.20.0",
    "trl>=0.24.0",
    "wandb>=0.22.3",
]
notebook = [
    "ipywidgets>=8.0.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.10.0",
]

[project.urls]
Homepage = "https://github.com/CLArg-group/inference-time-argumentation"
Repository = "https://github.com/CLArg-group/inference-time-argumentation"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ita*"]
namespaces = false
